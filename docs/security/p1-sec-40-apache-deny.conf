# =====================================================================================
# P1-SEC-40 -- Apache deny rules. NOT ACTIVE. NOT DEPLOYED. Reference copy only.
#
# Sibling of p1-sec-40-nginx-deny.conf. Neither file is read by any server: they are
# the written control, held here so the finding is not suppressed, while the live host
# keeps serving the paths below exactly as it does today.
#
# WHY THE RULES ARE HELD HERE AND NOT IN .htaccess
# ------------------------------------------------
# The live document root IS the repository root, and the deployed tree is a git
# checkout whose .git/HEAD reads `ref: refs/heads/main` (measured 2026-11-11). An
# .htaccess carrying these directives therefore goes live the moment anyone runs
# `git pull` on that host -- no deploy pipeline required, and no human intending it.
#
# The owner's standing instruction is the opposite:
#
#     "DO NOT block or change public access to the test website or its `.git`
#      directory." ... "Record the existing exposed Git history and credentials as
#      OWNER-DEFERRED -- UNRESOLVED SECURITY RISK."
#
# So the directives were lifted out of both .htaccess files and parked here. That is
# what makes a merge to main incapable of changing public access by accident. It is
# NOT a fix: the exposure is real, reachable, and unresolved.
#
# TO ACTIVATE (owner decision, not a deployer's): append the two rule groups below to
# the repository-root .htaccess ABOVE its <IfModule mod_rewrite.c> block, and the
# first group to public/.htaccess. Placement above that guard is deliberate -- the
# pre-existing <Files .env> deny sits inside it and silently stops applying if
# mod_rewrite is ever unloaded.
#
# MEASURED ON THE LIVE HOST 2026-11-11 (HEAD requests only, no bodies retrieved):
#   GET /.env                      -> 403   the <Files .env> rule is live
#   GET /storesyria_ecommercego.sql-> 404   dump absent from the deployed tree
#   GET /.git/HEAD                 -> 200   21 bytes = "ref: refs/heads/main"
#   GET /.git/config               -> 200   270 bytes
#   GET /.git/index                -> 200   10,376,528 bytes
#   GET /.git/objects/info/packs   -> 200   54 bytes -- names the packfiles
#   GET /.git/logs/HEAD            -> 200   3,647 bytes
#   GET /composer.lock             -> 200   611,406 bytes
#   GET /storage/logs/laravel.log  -> 200   3,421,645 bytes of text/plain
#   GET /a-nonexistent-path        -> 404   so the 200s above are real files
#
# A readable objects/info/packs names the packfiles, which is what an off-the-shelf
# .git dumper needs to reconstruct the whole history -- including the tracked database
# dump blob and, per CLAUDE.md, an unrotated APP_KEY. Removing the dump from the
# working tree does not close this: the blob stays in the packfile.
#
# RedirectMatch (mod_alias) is used for directories because <Directory> is illegal in
# .htaccess and <FilesMatch> cannot match a path prefix. 404 rather than 403 so the
# response does not confirm that a path exists.
#
# /storage/<file> is deliberately NOT denied: uploads are served through the
# public/storage symlink via Storage::url(), e.g. /storage/uploads/x.png. Only
# /storage/{logs,framework,app} are refused.
# =====================================================================================

# --- GROUP 1: both .htaccess files ---------------------------------------------------

# Version-control metadata, editor and dependency manifests.
RedirectMatch 404 "(?i)/\.(git|svn|hg|bzr|idea|vscode|env|DS_Store)(/|$)"

# Database dumps and backup files, by extension, including compressed variants.
<FilesMatch "(?i)\.(sql|dump|bak|backup|old|orig|save|swp|swo|sqlite|sqlite3|db|log)(\.(gz|bz2|xz|zip|tar|tgz|7z|rar))?$">
    <IfModule mod_authz_core.c>
        Require all denied
    </IfModule>
    <IfModule !mod_authz_core.c>
        Order Allow,Deny
        Deny from all
    </IfModule>
</FilesMatch>

# --- GROUP 2: repository-root .htaccess only -----------------------------------------

RedirectMatch 404 "(?i)^/(composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|artisan|phpunit\.xml|\.editorconfig|\.gitignore|\.gitattributes)$"

# Internal framework directories.
RedirectMatch 404 "(?i)^/storage/(logs|framework|app)(/|$)"
RedirectMatch 404 "(?i)^/(bootstrap/cache|tests|database/(migrations|seeders|factories))(/|$)"
