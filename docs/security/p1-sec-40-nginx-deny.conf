# =====================================================================================
# P1-SEC-40 -- nginx equivalent of the deny rules committed in /.htaccess.
#
# NOT IN USE TODAY. The live host answers `Server: Apache`, so the rules that matter
# are in /.htaccess and public/.htaccess. This file exists so the control survives a
# migration to nginx, where .htaccess is ignored entirely and every protection in it
# silently disappears. That is the failure this file prevents.
#
# Paste inside the `server { }` block for storesyria.com, BEFORE the
# `location / { try_files ... }` block. nginx picks the most specific match, so the
# regex locations below win over the catch-all regardless of order, but keeping them
# first keeps the intent readable.
#
# Context: the document root is the REPOSITORY root (a root index.php shim sits beside
# the root .htaccess), so repository internals are inside the served tree. On
# 2026-11-11 the Apache host served /.git/HEAD, /.git/index,
# /.git/objects/info/packs, /composer.lock and /storage/logs/laravel.log with 200 and
# real Content-Length values. A readable objects/info/packs names the packfiles, which
# is what an off-the-shelf .git dumper needs to rebuild the whole history.
# =====================================================================================

# Version-control metadata, editor state, dotfiles. `deny all` rather than `return 404`
# would also work; 404 is used so the response does not confirm the path exists.
location ~ /\.(git|svn|hg|bzr|idea|vscode|env|DS_Store)(/|$) {
    return 404;
}

# Dependency manifests and framework entry points. composer.lock names the exact
# version of every dependency, which is what turns a published advisory into a
# targeted exploit -- see the composer remediation in the same incident.
location ~ ^/(composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|artisan|phpunit\.xml)$ {
    return 404;
}

# Internal framework directories.
#
# /storage/<file> is deliberately NOT denied: uploads are served as
# /storage/uploads/<file> through the public/storage symlink via Storage::url(), so a
# blanket deny on /storage/ breaks every product image on the storefront. Only the
# three internal subtrees are refused.
location ~ ^/storage/(logs|framework|app)(/|$) {
    return 404;
}

location ~ ^/(bootstrap/cache|tests|database/(migrations|seeders|factories))(/|$) {
    return 404;
}

# Database dumps and backup files, by extension, including compressed variants.
location ~* \.(sql|dump|bak|backup|old|orig|save|swp|swo|sqlite|sqlite3|db|log)(\.(gz|bz2|xz|zip|tar|tgz|7z|rar))?$ {
    return 404;
}

# Directory listings off, matching `Options -Indexes` in the Apache config.
autoindex off;
