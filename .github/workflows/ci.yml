name: CI

# This file implements the workflow specified in
# docs/development/phase-1/01-SAFE-BASELINE.md 8.1, which was deliberately WRITTEN THERE
# AND NOT CREATED. Section 8.2 justifies every step individually and 8.3 records the
# dependency blocker; read both before changing anything here.
#
# Two deviations from 8.1, both strengthening it:
#   1. The phpunit.xml and .env checks live in .github/scripts/*.sh rather than inline
#      grep. The scripts strip XML comments before matching (a commented-out override
#      satisfies a naive grep while doing nothing), additionally require force="true",
#      and reject a config that points DB_* away from sqlite/:memory: even when a correct
#      entry is also present. Each was verified against six separate sabotages of a
#      throwaway copy of phpunit.xml.
#   2. Two cross-repo checks are added that 8.1 predates: the Flutter API contract and
#      admin auth coverage. Both run with nothing but `php`, which is what makes them
#      useful despite the blocker in 8.3.
#
# WHAT THIS PIPELINE IS NOT GIVEN. No production credentials of any kind: no DB_PASSWORD,
# no real APP_KEY, no gateway keys, no deploy key. `permissions: contents: read` and no
# secret beyond the automatic GITHUB_TOKEN. The suite runs against in-memory SQLite
# precisely so that no real credential is ever needed, and the "a .env is present" guard
# enforces that invariant rather than trusting it.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Everything here runs WITHOUT a vendor/ directory, and therefore runs today.
  # See 8.3: `composer install` cannot complete on a runner that cannot reach
  # api.github.com and git.yoomoney.ru, so any check that needed vendor/ would
  # simply never execute. These do not.
  # ---------------------------------------------------------------------------
  static:
    name: Static checks (no vendor needed)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan needs history, not just the tip

      - name: Refuse to run as root
        # A root build can write anywhere on the runner and makes every later step's
        # file permissions untrustworthy. GitHub-hosted runners are already non-root;
        # this asserts it rather than assuming it, and is the step that fails first if
        # someone adds a `container:` to this job.
        run: |
          if [ "$(id -u)" = "0" ]; then
            echo "::error::CI is running as root (uid 0). Refusing to proceed."
            exit 1
          fi
          echo "Running as uid $(id -u) ($(id -un)) -- not root."

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Mirrors the ext-* set derived from composer.lock, plus pdo_sqlite for tests.
          extensions: ctype, curl, dom, fileinfo, filter, gd, iconv, intl, mbstring, openssl, pdo, pdo_sqlite, phar, simplexml, sodium, tokenizer, xml, xmlreader, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: composer validate
        # Catches a malformed composer.json and a lock out of sync with it. With 61
        # direct packages, lock drift is a real and silent failure mode. This only reads
        # the two files; it resolves nothing and reaches no network.
        #
        # EXPECT THIS TO FAIL ON ITS FIRST RUN, and that is the point -- the same
        # argument 01-SAFE-BASELINE.md 8.1 makes for the other guards: a CI that passed
        # against the current tree would be worthless. Measured here:
        #
        #   ./composer.json is valid, but with a few warnings
        #   - require.myfatoorah/laravel-package : unbound version constraints (*)
        #     should be avoided
        #
        # and --strict turns that warning into exit 1. Two constraints are unbound:
        #   require:     myfatoorah/laravel-package  "*"
        #   require-dev: laravel/pint                "*"
        # `*` accepts ANY version, including a future major release and anything an
        # upstream account compromise publishes -- composer.lock pins what is installed
        # today, but any `composer update` resolves `*` afresh.
        #
        # Pinning them edits composer.json, which is an OWNER DECISION and explicitly
        # out of scope for Phase 1B, so it is NOT worked around here. Recommended:
        # myfatoorah/laravel-package "^2.2" (2.2.4 is what the lock holds) and
        # laravel/pint "^1.0". Drop --strict only as a deliberate, recorded choice --
        # not to make the board green.
        #
        # RESOLVED, as the paragraph above asked, by a deliberate and recorded choice that is
        # NARROWER than dropping --strict. On the first PR this workflow ever ran against,
        # this step failed on exactly the two warnings described above:
        #   - require.myfatoorah/laravel-package : unbound version constraints (*)
        # composer.json is BYTE-IDENTICAL to main, so this failure is not the PR's: it fails
        # the same way on main, and it is an owner decision to fix.
        #
        # So: still run --strict, and still FAIL on anything that is not one of the two known
        # unbound-constraint warnings. A malformed composer.json, or a lock out of sync with
        # it, fails exactly as before. The two accepted warnings are printed as CI warnings on
        # every run so they cannot be forgotten, and the moment a THIRD appears -- or either of
        # these is pinned -- this step fails and the allowance has to be re-justified.
        run: |
          set +e
          out="$(composer validate --strict --no-check-publish 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out"

          if [ "$code" -eq 0 ]; then
            exit 0
          fi

          # Every reported problem must be an unbound-constraint warning, and only for the
          # two packages recorded above.
          unexpected="$(printf '%s\n' "$out" \
            | grep -E '^- ' \
            | grep -vE '^- require(-dev)?\.(myfatoorah/laravel-package|laravel/pint) : unbound version constraints \(\*\) should be avoided' \
            || true)"

          if [ -n "$unexpected" ]; then
            echo "::error title=composer validate::A problem beyond the two accepted unbound constraints:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          echo "::warning title=Unbound dependency constraints (OWNER DECISION)::myfatoorah/laravel-package and laravel/pint are declared as \"*\". composer.lock pins what installs today, but any composer update resolves them afresh. Recommended: myfatoorah/laravel-package \"^2.2\" (2.2.4 is what the lock holds) and laravel/pint \"^1.0\". Editing composer.json is an owner decision, so this is reported, not worked around."

      - name: composer audit (locked set, no install)
        # Queries the advisory database against composer.lock. It needs NO vendor/ and
        # no install, which is why it can run in this job at all -- Phase 0 recorded a
        # caveat that only version-and-name reasoning was possible, and that caveat was
        # wrong.
        #
        # MEASURED on the lock at this commit (Agent 5, Phase 1B, reproduced from
        # scratch): 70 advisories across 22 packages -- 3 critical, 22 high, 34 medium,
        # 10 low, 1 unscored. `composer audit` exits 3 when it finds any, so this step
        # WOULD FAIL THE BUILD TODAY.
        #
        # It is therefore reported, not enforced, until the bump lands. Enforcing it now
        # would only teach people to ignore a red board, and the fix edits
        # composer.json/composer.lock, which is an explicit OWNER GATE and out of scope
        # for Phase 1B.
        #
        # ---------------------------------------------------------------------------
        # RE-VERIFIED Phase 1C (agent5-qa), and the earlier note here is CORRECTED on
        # three points. The 70/22/3-critical headline figure reproduced exactly.
        #
        # CORRECTION 1 -- it is 66 that clear, not 65, and the residual is 4, not 5.
        # The earlier note said the low firebase/php-jwt advisory was blocked by
        # "laravel/socialite v5.16.0 requiring ^6.4". That constraint is real but it is
        # the LOCKED socialite's constraint, and socialite is itself updatable inside
        # the constraint composer.json already carries:
        #     composer.json:36   "laravel/socialite": "^5.16"   permits v5.31.0
        #     socialite v5.31.0  requires firebase/php-jwt ^6.4|^7.0   -> 7.x allowed
        #     socialite v5.31.0  requires phpseclib/phpseclib ^4.0     -> 4.x allowed
        # So updating socialite is the enabling move, and it needs NO composer.json
        # change. It is also what makes the two MAJOR bumps in this set installable
        # (php-jwt 6->7 and phpseclib 3->4); neither is a direct require.
        #
        # CORRECTION 2 -- "every vulnerable package is transitive" is false. Three are
        # direct requires: aws/aws-sdk-php (^3.321), laravel/framework (^11.9) and
        # phpunit/phpunit (^11.0.1). The CONCLUSION still holds, because each of those
        # constraints already permits its patched version, so no composer.json edit is
        # needed -- but the stated reason was wrong.
        #
        # CORRECTION 3 -- the residual 4 are all laravel/framework, and all four are
        # fixed only on 12.x+. Measured from the advisory affectedVersions:
        #   CVE-2026-48019  CRLF injection, default email rule   fixed 12.60.0 / 13.10.0
        #   (unscored)      CRLF injection, default email rule   fixed 12.60.0 / 13.9.0+
        #   (medium)        temporary signed URL path confusion  fixed 12.61.1 / 13.12.0
        #   CVE-2026-102279 XSS in debug page information        fixed 12.69.0 / 13.30.0
        # The whole 11.x line is listed as affected with no 11.x fix boundary, so these
        # four cannot be cleared without a MAJOR framework upgrade. That is a framework
        # migration, which the owner has explicitly excluded. They stay OPEN and
        # reported, exactly like the .env exposure.
        #
        # STRENGTH OF EVIDENCE. The earlier figure came from applying bumps to a
        # throwaway copy of the lock -- constraint arithmetic only. This run has
        # something better: the vendor/ tree in the Phase 1C worktrees is DRIFTED AHEAD
        # of composer.lock, and every one of the 22 vulnerable packages is installed at
        # a higher version there. `composer audit` against that installed tree returns
        # 4 advisories across 1 package (laravel/framework) -- i.e. the 66 really do
        # clear at these versions, and the versions are mutually installable AND the
        # suite passes against them (Unit 25/25; Feature 439 tests with only the known
        # pre-existing failures). That is a measured integration preview, not arithmetic.
        #
        # READ THE CAVEAT BEFORE QUOTING THE 4. `composer install` in CI installs the
        # LOCK, so this step will keep reporting 70 until the lock is actually updated.
        # The 4 is the state of a tree that is ahead of the lock. It is a preview of the
        # post-update state, NOT the current CI state.
        #
        # THE REVIEWABLE UPDATE PLAN. Not run here and not applied anywhere: composer.lock
        # is owner-gated, and three pinned packages are unfetchable on a restricted
        # runner (see job `tests`). Ordered so the enabling package moves first.
        #
        #   # 1. the enabler -- unblocks the two major transitive bumps below
        #   composer update laravel/socialite --with-all-dependencies
        #   # 2. the three criticals (jmespath 1, phpspreadsheet 2)
        #   composer update mtdowling/jmespath.php phpoffice/phpspreadsheet \
        #                   --with-all-dependencies
        #   # 3. the rest, no composer.json change required by any of them
        #   composer update aws/aws-sdk-php dompdf/dompdf firebase/php-jwt \
        #                   guzzlehttp/guzzle guzzlehttp/psr7 league/commonmark \
        #                   league/flysystem livewire/livewire phpseclib/phpseclib \
        #                   psy/psysh symfony/http-foundation symfony/http-kernel \
        #                   symfony/mailer symfony/mime symfony/polyfill-intl-idn \
        #                   symfony/process symfony/routing symfony/yaml \
        #                   phpunit/phpunit --with-all-dependencies
        #   composer audit --locked        # expect 4, all laravel/framework
        #
        # ===================================================================
        # P1D agent5-QA INDEPENDENT RE-VERIFICATION OF THIS PLAN. The plan was
        # RUN, in an isolated scratch copy of composer.json/composer.lock with
        # --no-install and COMPOSER_VENDOR_DIR pointed outside every worktree.
        # The shared vendor/ was NOT touched (verified: no vendor dir created).
        #
        # VERDICT: the "expect 4" is CORRECT -- the three staged commands really
        # do take 70 advisories across 22 packages down to 4 across 1
        # (laravel/framework). Two side effects are NOT recorded above, and both
        # matter more than the 4:
        #
        #   CAVEAT A -- AS WRITTEN, THE PLAN PINS THE FRAMEWORK TO A DEV BRANCH.
        #   Run verbatim, laravel/framework resolves to 11.x-dev, NOT v11.57.0.
        #   Cause: composer.json sets minimum-stability: dev, and this composer
        #   blocks advisory-affected releases by default, so EVERY stable 11.x
        #   (v11.9.0 ... v11.57.0) is refused and the moving dev branch is taken
        #   instead. Quoted from the resolver when stability is forced to stable:
        #     "found laravel/framework[v11.9.0, ..., v11.57.0] but these were not
        #      loaded, because they are affected by security advisories"
        #   Adding --no-security-blocking to each command yields v11.57.0 stable,
        #   zero dev pins, and the same residual 4. Any application of this plan
        #   MUST pass that flag and MUST then assert the framework is v11.57.0,
        #   or it ships a dev branch to production.
        #
        #   CAVEAT B -- SEVEN MAJOR-VERSION CROSSINGS, FOUR OF THEM UNLISTED.
        #   The EXPECTED RESULTING VERSIONS table below names php-jwt 6->7 and
        #   phpseclib 3->4. The plan also crosses, transitively and unlisted:
        #     sabberworm/php-css-parser  v8.7.0 -> v9.5.0
        #     symfony/css-selector       v7.4.0 -> v8.1.6
        #     symfony/event-dispatcher   v7.4.0 -> v8.1.5
        #     symfony/filesystem         v7.4.0 -> v8.1.6
        #     symfony/string             v7.4.0 -> v8.1.7
        #   and changes 86 packages in total, not the ~22 named. The four
        #   symfony 8.1.x pins are the serious ones: the drifted vendor/ tree
        #   that the "measured integration preview" above was taken from carries
        #   symfony 7.4.x for all four, so those majors have NEVER been exercised
        #   by any suite run in this project. The preview does not cover them.
        #
        # WHY NO LOCK CHANGE IS COMMITTED. Applying it cannot be verified here:
        # the suite cannot be run against the resulting lock (vendor/ is 1.5 GB
        # with 1.7 GB free, so a lock-consistent isolated install does not fit;
        # the shared vendor/ must not be touched; and 6 locked packages are
        # unfetchable in this network). An unverified lock that pins four symfony
        # majors is a worse risk than 70 reported advisories, so composer.json
        # and composer.lock are left UNCHANGED and the ceiling below stays 70.
        #
        # A CONSERVATIVE ALTERNATIVE, also measured, for whoever applies this on
        # a tree where install works: dropping guzzle, phpspreadsheet, phpunit and
        # socialite from the set gives 70 -> 24 advisories with laravel/framework
        # held at v11.47.0, ZERO major crossings and ZERO new dev pins. It clears
        # 46 of the 70 with no compatibility question at all, and is the safer
        # first step if the symfony majors cannot be tested.
        # ===================================================================
        #
        # EXPECTED RESULTING VERSIONS (locked -> target), each verified installed and
        # exercised by the suite in this worktree:
        #   aws/aws-sdk-php          3.369.5  -> 3.400.1     league/flysystem   3.30.2 -> 3.36.0
        #   dompdf/dompdf            v3.0.0   -> v3.1.6      livewire/livewire  v3.7.3 -> v3.8.10
        #   firebase/php-jwt         v6.10.2  -> v7.2.1      mtdowling/jmespath 2.8.0  -> 2.9.2
        #   guzzlehttp/guzzle        7.10.0   -> 7.15.5      phpspreadsheet     1.30.1 -> 1.30.7
        #   guzzlehttp/psr7          2.8.0    -> 2.13.1      phpseclib          3.0.42 -> 4.0.2
        #   league/commonmark        2.8.0    -> 2.10.3      phpunit/phpunit    11.4.4 -> 11.5.57
        #   laravel/socialite        v5.16.0  -> v5.31.0     psy/psysh          v0.12.5-> v0.12.24
        #   symfony/http-foundation  v7.4.3   -> v7.4.20     symfony/mailer     v7.4.3 -> v7.4.19
        #   symfony/http-kernel      v7.4.3   -> v7.4.20     symfony/mime       v7.4.0 -> v7.4.19
        #   symfony/polyfill-intl-idn v1.33.0 -> v1.43.0     symfony/process    v7.4.3 -> v7.4.19
        #   symfony/routing          v7.4.3   -> v7.4.20     symfony/yaml       v7.2.0 -> v7.4.20
        #   laravel/framework        v11.47.0 -> v11.57.0  (does NOT clear its 4; see above)
        #
        # PRIORITISED BY REACHABILITY THROUGH ENABLED FUNCTIONALITY, highest first:
        #   1. mtdowling/jmespath.php  CRITICAL. Reached on every aws-sdk-php response
        #      parse, and aws-sdk is reachable from get_file()'s wasabi branch
        #      (app/Helper/helper.php:152-165) whenever storage_setting == 'wasabi'.
        #   2. phpoffice/phpspreadsheet  2 CRITICAL + 5 high. Reached by every product,
        #      customer and order IMPORT through maatwebsite/excel.
        #   3. guzzlehttp/guzzle + psr7  13 advisories. Every outbound HTTP call,
        #      including the recaptcha verify at PasswordResetLinkController.php:48 and
        #      every payment-gateway callback.
        #   4. league/commonmark  14 advisories, 9 high -- but reachable only where
        #      user-supplied markdown is rendered; required by laravel/framework ^2.7.
        #   5. symfony/* and the rest: framework-internal, lower direct reachability.
        #
        # KNOWN REFUTATION, RE-VERIFIED HERE so it is not re-raised. The phpspreadsheet
        # IOFactory::load() type-juggling concern does NOT apply to this codebase.
        # maatwebsite/excel never calls IOFactory::load(). Confirmed by grep over
        # vendor/maatwebsite/excel/src: zero `IOFactory::load(` call sites. Every path is
        # IOFactory::createReader($type) followed by $reader->load($path) --
        # Factories/ReaderFactory.php:32, Writer.php:139-140, Sheet.php:469,
        # Reader.php:269, Jobs/ReadChunk.php:193 -- with an explicitly chosen reader type
        # and a server-generated temporary path, so the vulnerable auto-detection branch
        # is never entered and the path is not attacker-influenced. phpspreadsheet is
        # still ranked 2nd above on its OTHER advisories, which are real.
        #
        # FLIP THIS TO ENFORCING (drop continue-on-error, and prefer
        # `--abandoned=ignore` over widening the audit) as soon as the owner approves the
        # bump. Leaving it advisory forever is how 70 advisories became 70 advisories.
        # ---------------------------------------------------------------------------
        continue-on-error: true
        run: composer audit --locked

      - name: composer audit must not grow
        # The ratchet that makes the advisory step above worth having. The count is
        # allowed to fall and never to rise, so a NEW vulnerable dependency fails the
        # build even while the known 70 are still being negotiated.
        env:
          AUDIT_CEILING: '70'
        run: |
          set -o pipefail
          composer audit --locked --format=plain > audit.txt 2>&1 || true
          found=$(sed -n 's/^Found \([0-9]\{1,\}\) security vulnerability advisor.*/\1/p' audit.txt | head -1)
          if [ -z "$found" ]; then
            if grep -qi 'no security vulnerability advisories' audit.txt; then
              found=0
            else
              echo "::error::Could not parse the advisory count from composer audit."
              cat audit.txt
              exit 1
            fi
          fi
          echo "advisories found: $found (ceiling $AUDIT_CEILING)"
          if [ "$found" -gt "$AUDIT_CEILING" ]; then
            echo "::error::Advisory count rose from $AUDIT_CEILING to $found. A new vulnerable dependency entered the lock."
            cat audit.txt
            exit 1
          fi
          if [ "$found" -lt "$AUDIT_CEILING" ]; then
            echo "::notice::Advisory count fell to $found. Lower AUDIT_CEILING to $found so the ratchet keeps holding."
          fi

      - name: Guard - test-database isolation is intact
        # THE SINGLE MOST VALUABLE STEP IN THIS FILE (8.2). RefreshDatabase runs
        # migrate:fresh, which DROPS EVERY TABLE in whatever database the suite points
        # at. This fails the build if the sqlite overrides are removed, commented out,
        # stripped of force="true", or re-pointed -- and if the bootstrap= line or
        # tests/bootstrap.php disappears, which would uninstall the PRIMARY control
        # while leaving the two <env> lines looking correct.
        run: .github/scripts/guard-test-isolation.sh .

      - name: Guard - no live .env in the checkout or the index
        run: .github/scripts/guard-no-env-files.sh .

      - name: Guard - GATE F money tables are still created by nothing
        # BLOCKING, and deliberately duplicated from
        # tests/Unit/Database/GateFSchemaContainmentTest.php, which asserts the same
        # property more thoroughly. The duplication is the point: that PHPUnit test only
        # runs in the `tests` job, which is gated behind ALLOW_COMPOSER_INSTALL because
        # three locked packages cannot be fetched on a restricted runner. So on most
        # runners the project's strongest guard over six MONEY-BEARING tables never
        # executes. This script needs no vendor/, so it runs on every push and PR.
        #
        # It fails the build if any discoverable migration, in either tree, creates
        # store_wallets, store_wallet_transactions, store_withdrawals,
        # store_order_financials, currency_rates or delivery_earnings -- and also if the
        # parked drafts disappear, which would make the first check pass for the wrong
        # reason. Seven of the suite's eight skips exist because three of these tables are
        # absent, so there is standing pressure to green them by inventing a schema; the
        # hasTable() guards in the surrounding migrations would then turn the real
        # migration into a silent no-op and freeze the guessed column types permanently.
        #
        # Verified not vacuous before being added: run against a throwaway 213-file tree
        # it passes, and against the same tree with one invented
        # Schema::create('store_wallets') migration it exits non-zero and names the file.
        run: .github/scripts/guard-gate-f-containment.sh .

      - name: Guard - packages/workdo/ is unmodified
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${BASE_SHA:-}"
          if [ -z "$base" ]; then
            base="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          .github/scripts/guard-no-workdo-changes.sh "$base" .

      - name: php -l on changed PHP files
        # Scoped to the diff so it stays fast on a large legacy codebase and so
        # pre-existing issues in untouched files do not block unrelated work.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-$BEFORE_SHA}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          changed="$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.php' \
                     | grep -v '^vendor/' || true)"
          if [ -z "$changed" ]; then
            echo "No PHP files changed."
            exit 0
          fi
          rc=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            php -l "$f" || rc=1
          done <<< "$changed"
          exit "$rc"

      - name: Cross-repo API contract - the shipped Flutter app must not be broken
        # The Flutter admin app pins its endpoint paths as constants compiled into a
        # binary already on merchants' phones. A server-side route rename silently
        # breaks every installed copy, visible only as a 404 in the logs. Runs against
        # the committed manifest, so no Flutter checkout is required here.
        run: php tests/Support/ApiContract/bin/check-contract.php

      - name: Admin API auth coverage must not regress
        # Fails if an /api/admin/* route without authentication middleware appears
        # outside the recorded baseline.
        #
        # UPDATED IN PHASE 1C. This comment previously read "13 such routes already do;
        # 10 of them must be protected", which was true of the Phase 1B manifest and is
        # no longer true of the file this step actually reads: the baseline is now
        # 3 ROUTES, ALL THREE LEGITIMATELY PUBLIC, and must_be_protected is EMPTY. The
        # 10 that had to be protected were protected in Phase 1C, including the
        # anonymous write to /api/admin/orders/notes/create that was confirmed
        # empirically. See the manifest's _history for what each phase closed.
        #
        # Two separate branches described this same artefact in Phase 1C -- one shrank
        # the manifest, the other rewrote this file -- and because they touched
        # different files Git reported no conflict at all. The contradiction landed
        # here. AdminApiSurfaceTest now PINS the manifest's contents, so the file
        # cannot drift from reality again without a test failing.
        run: php tests/Support/ApiContract/bin/check-auth-coverage.php

  # ---------------------------------------------------------------------------
  # Secret scanning. Two layers: a dependency-free screen over the diff that always
  # runs, and gitleaks over full history, which needs its action to be reachable.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff screen (no dependencies)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="${BASE_SHA:-$BEFORE_SHA}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          .github/scripts/scan-secrets.sh "$base" .

      - name: Gitleaks (full history) -- REPORTED, NOT ENFORCED
        # This WILL find real credentials, and that is expected: `.env` is committed
        # (recoverable at 3c39c160), so history genuinely contains an APP_KEY and the
        # database credential set.
        #
        # WHY continue-on-error. The project owner has reviewed that exposure and
        # decided: do not rotate or replace any credential, do not delete or modify
        # the deployed .env, these operations must not block ongoing development --
        # and KEEP the finding open, not marked fixed or production-ready. A history
        # scan over an un-rotated history fails on every run by construction, so
        # enforcing it would make the board permanently red over a consciously
        # deferred finding. Allowlisting the file instead would bury it.
        #
        # So the two layers are split by what they can usefully enforce:
        #   - this job's "Diff screen" step above is BLOCKING. It only sees changed
        #     lines, so it fails exactly when a NEW secret is introduced.
        #   - this step is REPORTING. It covers history, which cannot be made clean
        #     without the rotation the owner has deferred.
        # The finding therefore stays visible on every run while development
        # continues. REMOVE continue-on-error as soon as the credentials are rotated
        # and .env is untracked; leaving it forever is how a scanner becomes decor.
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_CONFIG: .github/gitleaks.toml

  # ---------------------------------------------------------------------------
  # THIS JOB IS GATED, AND NOT BECAUSE OF A DEFECT IN THE PROJECT.
  #
  # composer.lock pins three packages that a stock restricted runner cannot fetch
  # (01-SAFE-BASELINE.md 8.3, measured):
  #   lahirulhr/laravel-payhere v1.0.4   dist is an api.github.com zipball -> HTTP 403
  #   yoomoney/yookassa-sdk-php 3.7.1    git.yoomoney.ru -> unreachable (curl 56)
  #   yoomoney/yookassa-sdk-validator    same host; pulled in transitively
  # Two more (myfatoorah/laravel-package, myfatoorah/library) carry no dist at all and
  # must be git-cloned from dev.azure.com.
  #
  # GitHub-hosted runners reach all of these by default. A self-hosted runner, a
  # corporate proxy or a locked-down container will not, and the install aborts leaving
  # vendor/ unusable -- so this job is opt-in rather than silently red forever.
  #
  # TO ENABLE: set the repository variable ALLOW_COMPOSER_INSTALL to 'true' once the
  # runner can reach api.github.com, git.yoomoney.ru and dev.azure.com. Changing
  # composer.json to drop the packages is an OWNER DECISION and is NOT a workaround to
  # apply here -- app/ and routes/ both reference those SDKs' classes, so removing them
  # without removing the references is a fatal error at class load.
  # ---------------------------------------------------------------------------
  tests:
    name: Tests (sqlite only)
    runs-on: ubuntu-latest
    if: vars.ALLOW_COMPOSER_INSTALL == 'true'

    env:
      # Belt and braces: REAL environment variables. Laravel's Dotenv loader is
      # documented as immutable, so these are expected to beat any .env that reaches a
      # runner -- but the job does not rest on that. The explicit assertion below, and
      # Layer 0 inside the suite, are what actually enforce it.
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      APP_ENV: testing

    steps:
      - uses: actions/checkout@v4

      - name: Refuse to run as root
        run: |
          if [ "$(id -u)" = "0" ]; then
            echo "::error::CI is running as root (uid 0). Refusing to proceed."
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, filter, gd, iconv, intl, mbstring, openssl, pdo, pdo_sqlite, phar, simplexml, sodium, tokenizer, xml, xmlreader, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Hard guard - refuse to run against anything but sqlite
        run: |
          test "${DB_CONNECTION}" = "sqlite"   || { echo "::error::DB_CONNECTION is not sqlite";   exit 1; }
          test "${DB_DATABASE}"   = ":memory:" || { echo "::error::DB_DATABASE is not :memory:";   exit 1; }
          if [ -f .env ]; then
            echo "::error::A .env is present in CI. CI must never carry real credentials."
            exit 1
          fi

      - name: Guard - test-database isolation is intact
        # Repeated here deliberately. The static job proves the config is correct; this
        # proves it is still correct in the job that actually runs migrate:fresh.
        run: .github/scripts/guard-test-isolation.sh .

      - name: Create the storage skeleton (absent from the repo)
        # storage/ is gitignored, so a fresh clone cannot boot the framework without
        # this. It is also a standing reminder that a fresh clone is not runnable.
        run: mkdir -p storage/framework/{cache/data,sessions,views,testing} storage/logs bootstrap/cache

      - name: Clear the committed-and-stale bootstrap cache
        # NO LONGER STRICTLY NEEDED, and kept as cheap insurance.
        #
        # bootstrap/cache/packages.php and services.php USED to be committed, and were
        # stale: they named Lahirulhr\PayHere\PayHereServiceProvider from a vendor tree
        # that no longer resolves, so the framework fatalled on boot before a single
        # test ran. Commit e0c75b71 untracked them and added
        # bootstrap/cache/.gitignore ("*" / "!.gitignore"), the upstream
        # laravel/laravel layout, so a fresh clone no longer carries a stale manifest.
        # `git ls-files bootstrap/cache/` now lists only .gitignore.
        #
        # The rm stays because it is free and because a manifest can still be left
        # behind by a cached workspace on a self-hosted runner. Regeneration is proven
        # on both paths: composer's post-autoload-dump runs `package:discover`, and
        # PackageManifest::getManifest() rebuilds on demand when the file is absent
        # (Illuminate/Foundation/PackageManifest.php:101-111).
        run: rm -f bootstrap/cache/packages.php bootstrap/cache/services.php

      - name: Satisfy the installer sentinel
        # app/Http/Controllers/HomeController.php has a bare exit() in its CONSTRUCTOR
        # when storage/installed is absent. Under PHPUnit that KILLS THE PROCESS with no
        # output, no failure count and no junit file -- the run simply stops after the
        # Unit suite and looks like a hang. storage/ is gitignored, so the sentinel is
        # never in a fresh clone.
        #
        # The real fix is to replace that exit() with a redirect or an abort(), which
        # lives in a file this agent does not own; see cross_agent_dependencies. Until
        # then the sentinel is created so the suite can run at all.
        run: touch storage/installed

      - name: Install dependencies
        # --no-scripts is load-bearing: post-autoload-dump runs `artisan
        # package:discover`, which BOOTS THE APPLICATION, and post-create-project-cmd
        # contains `artisan migrate --graceful`, which must never run in CI.
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: vendor/ must match composer.lock -- BLOCKING
        # THE ONE PLACE THIS CHECK HAS TEETH, and the reason it is blocking here while it
        # is only advisory everywhere else: `composer install` ran from the lock in the
        # step immediately above, so vendor/ MUST match the lock. If it does not, the
        # install is broken, a cached workspace leaked in, or the lock was edited without
        # reinstalling -- and every number this job goes on to print would describe a
        # dependency set nobody chose.
        #
        # WHY THE PROJECT NEEDS THIS AT ALL. Every test number reported in Phases 1A-1E
        # came from a developer vendor/ tree that does NOT match composer.lock. Measured
        # on p1e/agent5-qa at de8646b7: 239 locked, 235 installed, 85 at the locked
        # version, 148 at a DIFFERENT version, 6 locked-but-absent, 2 present-but-unlocked,
        # 4 crossing a MAJOR version, and the framework under test at 11.57.0 against a
        # lock pinning 11.47.0. `composer validate` passes throughout, because it compares
        # composer.json to composer.lock and never looks at vendor/. Nothing compared the
        # third pair until this guard existed.
        #
        # The guard is itself covered by tests/Unit/Dependency/ComposerLockIntegrityGuardTest.php,
        # which feeds it synthetic lock/installed pairs with known verdicts -- including one
        # differing by a single patch release, so loosening the comparison fails that test.
        run: .github/scripts/guard-composer-lock-integrity.sh .

      - name: Assert the committed fake test key is present
        # NO key:generate. .env.testing carries a FIXED, deliberately fake APP_KEY,
        # committed on purpose because it protects nothing and is used only by the
        # suite. Generating one here would write into a tracked file, and CI is never
        # given a real key. This step only proves the fake one shipped.
        run: |
          test -f .env.testing || { echo "::error::.env.testing is missing."; exit 1; }
          grep -q '^APP_KEY=base64:' .env.testing || { echo "::error::.env.testing has no fixed test APP_KEY."; exit 1; }

      - name: Unit suite
        # MEASURED green in a real PHPUnit 11.5.57 run against sqlite :memory:
        # (agent5-qa, Phase 1C): 25 tests, 212 assertions, 0 failures, 0 skipped.
        # The "8 tests, 16 assertions" previously recorded here was the pre-integration
        # figure and is corrected. 21/189 was the figure before this branch added
        # tests/Unit/Database/GateFSchemaContainmentTest.php (+4 tests, +23 assertions).
        #
        # This job is BLOCKING on purpose: the Unit suite has no known failures, so any
        # red here is a real regression.
        run: vendor/bin/phpunit --testsuite Unit --testdox

      - name: Feature suite
        # Allowed to fail so the rest of the pipeline stays meaningful, and the reason is
        # now a KNOWN, BOUNDED set rather than an open question.
        #
        # The three MySQL-only migrations that used to block the whole suite are guarded
        # by driver on p1b/agent2-db, which is merged here:
        #   2024_05_16_054044_add_id_to_currency_table.php          ($table->id()->first())
        #   2024_05_29_102438_add_customers_tbale_forienkey_...php  (SET foreign_key_checks)
        #   2024_06_05_094055_drop_role_name_unique_in_roles_...php (SHOW INDEX)
        #
        # BASELINE MEASURED on the p1b/integration tip (bd6900bc) and reproduced
        # independently on p1c/agent5-qa before any change:
        #   Unit     OK -- 21 tests, 189 assertions
        #   Feature  439 tests, 2557 assertions, 0 ERRORS, 14 failures, 8 skipped
        #
        # THE 14 WERE TRIAGED TEST-BY-TEST IN PHASE 1C (agent5-qa), and the root-cause
        # breakdown previously recorded here is CORRECTED. It attributed 6 failures to
        # get_file(), 1 to ExampleTest's missing RefreshDatabase, 3 to the Breeze
        # ResetPassword notification, 2 to profile.edit and 2 to "the WorkDo auth flow
        # differing from Breeze". Measured causes, each read off a real stack trace:
        #
        #   6x PAGE RENDER -- blocked by TWO defects in sequence, not one.
        #      First app/Helper/helper.php:145 reads $admin->current_store with no null
        #      guard after User::where('type','super admin')->first(). Seeding a super
        #      admin does NOT make them pass: the next failure is
        #        no such table: owner_menu_settings
        #      from resources/views/layouts/guest.blade.php:96. That migration EXISTS, at
        #      packages/workdo/LandingPage/src/database/migrations/
        #      2024_08_05_060912_create_owner_menu_settings_table.php, but no
        #      loadMigrationsFrom() registers addon-module migration paths, so they never
        #      run under RefreshDatabase. NO page in this product can render in the test
        #      database. The earlier note named only the first defect.
        #   2x profile.edit -- NOT "a Breeze feature never built". The route IS declared
        #      at routes/web.php:396 and is silently dropped because routes/web.php:844
        #      re-declares GET `profile`; RouteCollection indexes by method+URI, so the
        #      later declaration replaces it and the NAME disappears. Live defect:
        #      ProfileController.php:37 redirects to that name, so every successful
        #      PATCH /profile writes the record and then 500s. See
        #      tests/Feature/Platform/RouteRegistrationIntegrityTest.php, which also
        #      finds a second lost name (contact.us, routes/customer.php:57).
        #   1x ExampleTest -- confirmed: no RefreshDatabase. It ALSO asserted 200 on `/`,
        #      which this product answers with 302 -> /login. Both corrected.
        #   3x ResetPassword -- confirmed: the product sends its own
        #      CustomResetPasswordNotification (PasswordResetLinkController.php:87).
        #      Corrected; 2 now pass, 1 still blocked on the page render above.
        #   2x "auth flow differing" -- resolved into two distinct REAL defects, not a
        #      flow difference: login AUTHENTICATES successfully and then 500s on
        #      Utility.php:3098 ($companyRole->hasPermission() on null), and registration
        #      500s on RegisteredUserController.php:249 (addRole(null)). Both are
        #      unguarded null derefs on a database whose roles are not seeded.
        #
        # VERDICT, with the exact arithmetic measured rather than estimated. Of the 14:
        #   3 now PASS, because their assertions were wrong and were corrected in place:
        #       ExampleTest (asserted 200 on `/`; product answers 302 -> /login)
        #       PasswordResetTest::test_reset_password_link_can_be_requested
        #       PasswordResetTest::test_password_can_be_reset_with_valid_token
        #   11 remain RED, every one on a real defect, and were deliberately NOT retired:
        #       7  page renders, blocked by owner_menu_settings + get_file (see above):
        #          login, register, forgot-password, reset-password, verify-email and
        #          confirm-password screens, plus the profile page. NOTE: the briefed
        #          figure for this group was 6. It is 7 -- the reset-password screen was
        #          previously failing on the notification class, which MASKED the fact
        #          that its render is blocked too.
        #       2  profile.edit route shadowing (ProfileTest, both update paths)
        #       1  login POST: authenticates, then 500s on Utility.php:3098
        #       2  register POST: 500s on RegisteredUserController.php:249
        #          -- counted as 1 failing test here (test_new_users_can_register); the
        #             register SCREEN is already counted in the 7 above.
        # Nothing was deleted, skipped or weakened. A test asserting a real defect is a
        # test doing its job.
        #
        # Coverage was RAISED rather than cut, which is the whole point of correcting a
        # scaffold test instead of deleting it: tests/Feature/Platform/WorkdoAuthFlowTest.php
        # adds 11 passing tests over the real credential check, logout, the product's real
        # store-signup validation contract and profile persistence, and PasswordResetTest
        # gained an end-to-end token test and a forged-token negative case that the three
        # original notification-class assertions never covered.
        #
        # THE 9 SKIPS, read from a real run with --display-skipped rather than assumed.
        # RE-MEASURED on p1d/agent5-qa. The split recorded here for p1c ("7 + 1") is now
        # 8 + 1, because WithdrawalAuthorizationTest added a fourth GATE F skip site.
        #   8 name a GATE F money table -- store_wallets (x3),
        #     store_wallet_transactions (x2), store_withdrawals (x2), plus
        #     WithdrawalAuthorizationTest -- across FinancePermissionTest,
        #     WithdrawalAuthorizationTest, CrossTenantModelIsolationTest and
        #     ModelInitializationTest. All MUST stay skipped: their column types are not
        #     derivable from $fillable and inventing them is forbidden.
        #   1 is DeliverySyriaWebhookTest::test_a_valid_token_cannot_move_another_stores_order,
        #     blocked on `zid_orders`/`zid_stores`, which are NOT among the six money
        #     tables. A legitimate skip on the same defect class (undeclared table).
        #     Re-verified: 0 discoverable migrations create either. NOTE its docblock is
        #     now partly stale -- it still claims users.deliverysyria_secret is undeclared,
        #     but database/migrations/2026_10_12_000103_add_deliverysyria_secret_to_users_table.php
        #     declares it. The skip stays correct because its hasTable() guard is on the
        #     two tables, not the column. That file is owned by another agent.
        #   ALL NINE REASONS WERE RE-VERIFIED AND STILL HOLD. None is skipping for a
        #   reason that has lapsed.
        #
        # THE COVERAGE GAP IS CONFIRMED, and the note recorded here for p1c was right:
        # only 3 of the 6 GATE F tables appear in any skip. The three that do are
        # store_wallets, store_wallet_transactions and store_withdrawals. The three with
        # NO reported skip are store_order_financials, currency_rates and
        # delivery_earnings -- so the skip count makes the gate look better covered than
        # it is. Per table: delivery_earnings has a financial assertion wrapped in
        # `if ($hasEarnings)` at OrderMutationTest.php:160-173 that silently does not run
        # (deliberate and argued at :147, but invisible in the skip count);
        # store_order_financials has only a comment and an absence-tripwire;
        # currency_rates has only a static model-to-table mapping, despite 6 live call
        # sites in StoreCurrencyConversionService and Api/DashboardController.
        # tests/Unit/Database/GateFSchemaContainmentTest.php guards the six against being
        # greened by an invented schema, and tests/Unit/Database/GateFCoverageLedgerTest.php
        # now makes this gap EXPLICIT and RATCHETED so it cannot silently grow.
        #
        # MEASURED ON THIS BRANCH, p1d/agent5-qa, full suite:
        #   Unit     OK -- 30 tests, 232 assertions          (inherited 25 / 212)
        #   Feature  661 tests, 3366 assertions, 0 ERRORS, 15 failures, 9 skipped
        #                                                   (inherited 658 / 3353 / 0 / 13 / 9)
        # 15 = the 13 inherited failures, every one still present and still red, + 2 NEW
        # INTENTIONAL failures from tests/Feature/Platform/NullTenantGuardCanaryTest.php,
        # which call the two app/ null-dereference sites DIRECTLY instead of reaching them
        # through a page render, so the exact line is named and a landed guard is provable.
        # Errors stay 0 and skips stay 9. Nothing was skipped, disabled, deleted or
        # weakened. Per-suite, measured individually:
        #   Security 231 tests / 1965 assertions / 0 failures / 3 skipped
        #   Tenancy  235 tests /  748 assertions / 0 failures / 6 skipped
        #   Commerce 151 tests /  545 assertions / 0 failures / 0 skipped  (OK)
        #
        # ROOT CAUSES OF THE 15, measured per test rather than attributed:
        #   7  app/Helper/helper.php:143-145 -- get_file() reads ->current_store off a null
        #      super admin, so every page render 500s.
        #   2  the two canaries above (helper.php:145 and Utility.php:3098/:3144).
        #   1  app/Models/Utility.php:3098 via the login path.
        #   1  app/Http/Controllers/Auth/RegisteredUserController.php:249 -- addRole(null)
        #      AFTER the user, store and login are committed (half-provisioned merchant).
        #   4  the route-shadowing defect: profile.edit (routes/web.php:417 shadowed by
        #      :865) and contact.us (routes/customer.php:57 shadowed by :68).
        #   NONE of the 15 is a stock-Breeze assertion about unimplemented behaviour. Every
        #   one traces to a real defect in app/ or routes/, so none may be retired.
        #
        # IMPORTANT, MEASURED: guarding helper.php:145 ALONE does not green the 7 render
        # failures. With a temporary local guard applied (and reverted), they still fail --
        # on `no such table: owner_menu_settings` from guest.blade.php. And guarding
        # Utility.php:3098 alone moves the error to :3144, a SECOND unguarded role
        # dereference. Do not expect the board to clear from the null guards alone.
        #
        # REMOVE continue-on-error once those defects are fixed in app/ and routes/ and the
        # addon migration paths are registered. They are pre-existing, not regressions, and
        # nothing outside that set fails.
        continue-on-error: true
        run: vendor/bin/phpunit --testsuite Feature --testdox

  # ---------------------------------------------------------------------------
  # IS THE LOCK ACTUALLY INSTALLABLE? -- the measurement this project has never made.
  #
  # THE PROBLEM THIS JOB EXISTS TO SOLVE. The project's single unmet exit criterion is
  # that no reported number was measured against composer.lock. The `tests` job above
  # would fix that, but it is gated behind the ALLOW_COMPOSER_INSTALL repository
  # variable, so on most runners it never executes -- and the variable exists because
  # three locked packages could not be fetched from the DEVELOPMENT CONTAINER:
  #
  #   lahirulhr/laravel-payhere v1.0.4   dist: api.github.com/.../zipball/72ce0aa8
  #   yoomoney/yookassa-sdk-php 3.7.1    dist: git.yoomoney.ru/rest/api/.../archive
  #   yoomoney/yookassa-sdk-validator    dist: git.yoomoney.ru/rest/api/.../archive
  #
  # That gate was set from inside the container, and this is the measured reason it
  # should not have been generalised to every runner:
  #
  #   * All three packages EXIST. repo.packagist.org/p2/<name>.json returns HTTP 200
  #     for each. None is deleted, renamed or abandoned-and-removed.
  #
  #   * The payhere 403 is THE CONTAINER'S EGRESS POLICY, not GitHub's and not the
  #     package's. api.github.com/ answers 200, but every /repos/*/zipball/* request
  #     answers 403 -- including laravel/framework's, a repo whose zipballs serve fine
  #     anywhere. The 403 body is the proxy's own text: "GitHub access to this
  #     repository is not enabled for this session." A GitHub-hosted runner has no such
  #     per-session repository scoping, so this package is expected to install here.
  #
  #   * git.yoomoney.ru is NOT DETERMINABLE from the container at all: DNS does not
  #     resolve and the proxy answers 403 to CONNECT, which its own status endpoint
  #     describes as "policy denial OR upstream failure". Those two cannot be separated
  #     from inside, and github.com/yoomoney/* is 403 by the same policy, so even a
  #     mirror check is impossible there. THIS JOB IS THE MEASUREMENT.
  #
  # WHY IT IS continue-on-error AND NOT A GATE. Because the yoomoney answer is unknown.
  # Shipping a blocking job whose outcome has never been observed would put a red on the
  # board that nobody can act on, which is exactly how the two permanently-red jobs that
  # had to be converted to report-only in Phase 1B came about. This job is here to turn
  # an unknown into a measurement. ONCE IT IS OBSERVED GREEN: delete the
  # continue-on-error, delete the ALLOW_COMPOSER_INSTALL condition on the `tests` job,
  # and CI -- not any developer container -- becomes the reproducible environment for
  # every number this project reports.
  #
  # IF IT IS OBSERVED RED ON THE YOOMONEY HOST: the honest remedies are a composer
  # repository mirror or a vendored dist for those two packages, both of which are owner
  # decisions. The forbidden remedy is editing the lock to drop them: app/Models/Utility.php
  # (:1580-1594 yookassa, :1669-1674 payhere) and 338 other references across app/,
  # routes/, config/ and packages/ reach those integrations, so removing them is a fatal
  # at class load, not a dependency cleanup.
  # ---------------------------------------------------------------------------
  lockfile-reproducibility:
    name: Is composer.lock installable? (report)
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      APP_ENV: testing

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, filter, gd, iconv, intl, mbstring, openssl, pdo, pdo_sqlite, phar, simplexml, sodium, tokenizer, xml, xmlreader, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Do the three disputed packages exist at all?
        # Cheap, needs no install, and separates "package is gone" from "host is blocked"
        # before the install attempt makes that distinction expensive to read.
        run: |
          for p in lahirulhr/laravel-payhere yoomoney/yookassa-sdk-php yoomoney/yookassa-sdk-validator; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://repo.packagist.org/p2/${p}.json" || echo 000)
            echo "packagist metadata ${p}: HTTP ${code}"
          done

      - name: Attempt the real install from the lock
        id: install
        # continue-on-error so the measurement below runs either way. See the job header.
        # --no-scripts matches the `tests` job: post-autoload-dump boots the application
        # and post-create-project-cmd runs `artisan migrate --graceful`.
        continue-on-error: true
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Verdict
        # Always runs. This is the line a human reads to decide whether CI can become the
        # project's reproducible environment.
        run: |
          if [ "${{ steps.install.outcome }}" = "success" ]; then
            echo "::notice::composer.lock INSTALLED on an ubuntu-latest GitHub-hosted runner."
            echo "::notice::The three disputed packages are fetchable here. The restriction is the development container's egress policy, not the lock."
            echo "::notice::NEXT: drop continue-on-error on this job and the ALLOW_COMPOSER_INSTALL condition on the tests job."
          else
            echo "::warning::composer install from the lock FAILED on a GitHub-hosted runner."
            echo "::warning::This is the measurement the project was missing. Read the step log above for the failing dist URL."
            echo "::warning::Do NOT remove the package from the lock -- app/ and routes/ reference its classes."
          fi

      - name: vendor/ must match composer.lock
        # Only meaningful if the install succeeded. Blocking WITHIN this conditional
        # branch: if composer installed from the lock and the result still does not match
        # the lock, that is a defect regardless of the host question above.
        if: steps.install.outcome == 'success'
        run: .github/scripts/guard-composer-lock-integrity.sh .

      - name: Prepare the runtime the suite needs
        if: steps.install.outcome == 'success'
        # Identical to the `tests` job: storage/ is gitignored, the committed bootstrap
        # cache is stale, and HomeController's constructor has a bare exit() when
        # storage/installed is absent -- which under PHPUnit kills the process with no
        # output and looks like a hang.
        run: |
          mkdir -p storage/framework/{cache/data,sessions,views,testing} storage/logs bootstrap/cache
          rm -f bootstrap/cache/packages.php bootstrap/cache/services.php
          touch storage/installed

      - name: Unit suite against the LOCKED dependency set
        if: steps.install.outcome == 'success'
        # The first Unit result in this project's history measured against composer.lock
        # rather than against a drifted developer tree. Compare it to the figure recorded
        # on the drifted tree: 30 tests, 232 assertions, 0 failures. A difference here is
        # information, not noise -- it is the cost of the drift, finally visible.
        continue-on-error: true
        run: vendor/bin/phpunit --testsuite Unit

      - name: Feature suite against the LOCKED dependency set
        if: steps.install.outcome == 'success'
        # Drifted-tree reference on de8646b7: 924 tests, 4184 assertions, 0 errors,
        # 12 failures, 17 skipped. Reported, not enforced, for the same reason the
        # `tests` job reports it: the 12 failures are a known, bounded, documented set.
        continue-on-error: true
        run: vendor/bin/phpunit --testsuite Feature --display-skipped
